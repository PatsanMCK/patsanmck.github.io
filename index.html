    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
      background-color: #141218;
      overflow: hidden; /* Full-screen 16:9 lock on 1920x1080 and 2560x1440 */
    }

    /* Full-screen darkened & blurred PFP background */
    .bg-backdrop {
      position: fixed;
      inset: -5%;
      background-image: var(--pfp-cdn), var(--pfp-fallback);
      background-size: cover;
      background-position: center;
      filter: blur(8px) brightness(0.32) contrast(1.05);
      z-index: -2;
      transform: scale(1.05);
    }

    .bg-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(87, 42, 87, 0.15) 0%, rgba(0, 0, 0, 0.55) 100%);
      z-index: -1;
    }

    /* ==========================================================
       16:9 DESKTOP STAGE (Scales seamlessly from 1920x1080 to 2560x1440)
       ========================================================== */
    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vw;
    }

    .layout-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(86vw, 152vh);
      gap: 5vw;
      padding: 3.4vw 4.2vw;
      background: rgba(20, 18, 24, 0.45);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(168, 85, 247, 0.22);
      border-radius: 2.8vw;
      box-shadow: 
        0 2vw 4.5vw rgba(0, 0, 0, 0.65),
        0 0 2.5vw rgba(139, 61, 255, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Left Side: PFP Image Box */
    .pfp-frame {
      flex-shrink: 0;
      width: clamp(260px, 28vw, 760px);
      height: clamp(260px, 28vw, 760px);
      border-radius: 3.6vw;
      border: 0.55vw solid #572a57;
      box-shadow: 
        0 1.2vw 3vw rgba(0, 0, 0, 0.65),
        0 0 2vw rgba(168, 85, 247, 0.28);
      overflow: hidden;
      background-color: #1f1b24;
      background-image: var(--pfp-fallback);
      background-size: cover;
      background-position: center;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .pfp-frame:hover {
      transform: scale(1.025) rotate(-1deg);
      border-color: #7d3c7d;
      box-shadow: 
        0 1.5vw 3.5vw rgba(0, 0, 0, 0.8),
        0 0 2.8vw rgba(192, 108, 255, 0.45);
    }

    .pfp-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Right Side: Text, Ranks & Socials */
    .right-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 3vw;
    }

    .title {
      font-size: clamp(2.2rem, 3.8vw, 6.2rem);
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #ffffff;
      text-shadow: 0 0.3vw 1.2vw rgba(0, 0, 0, 0.55);
      white-space: nowrap;
    }

    /* ScoreSaber Logo + Ranks Row */
    .ranks-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.6vw;
      padding: 1.1vw 2.2vw;
      border-radius: 1.8vw;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      text-decoration: none;
      color: #ffffff;
      transition: all 0.25s ease;
    }

    .ranks-box:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 222, 24, 0.45);
      transform: translateY(-0.25vw);
      box-shadow: 0 0.8vw 2vw rgba(0, 0, 0, 0.4), 0 0 1.5vw rgba(255, 222, 24, 0.15);
    }

    .scoresaber-logo {
      width: clamp(54px, 4.8vw, 130px);
      height: clamp(54px, 4.8vw, 130px);
      object-fit: contain;
      filter: drop-shadow(0 0.4vw 0.8vw rgba(0, 0, 0, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .ranks-box:hover .scoresaber-logo {
      transform: scale(1.1) rotate(-6deg);
    }

    .ranks-list {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4vw;
    }

    .rank-item {
      display: flex;
      align-items: center;
      gap: 0.8vw;
      font-size: clamp(1.7rem, 2.7vw, 4.5rem);
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .badge-icon {
      width: clamp(28px, 2.6vw, 68px);
      height: clamp(28px, 2.6vw, 68px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0.2vw 0.5vw rgba(0, 0, 0, 0.4));
    }

    /* Social Icons Row */
    .socials-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.8vw;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease, box-shadow 0.25s ease;
    }

    .social-btn:hover {
      transform: translateY(-0.45vw) scale(1.08);
    }

    /* Telegram Button */
    .btn-tg {
      width: clamp(64px, 5.6vw, 150px);
      height: clamp(64px, 5.6vw, 150px);
      border-radius: 50%;
      background: linear-gradient(180deg, #37aee2 0%, #1e96c8 100%);
      box-shadow: 0 0.6vw 1.6vw rgba(30, 150, 200, 0.45);
    }
    .btn-tg:hover {
      box-shadow: 0 0.9vw 2.2vw rgba(55, 174, 226, 0.7);
    }
    .btn-tg svg {
      width: 52%;
      height: 52%;
      transform: translate(-3%, 2%);
    }

    /* X (Twitter) Button */
    .btn-x {
      width: clamp(64px, 5.6vw, 150px);
      height: clamp(64px, 5.6vw, 150px);
      border-radius: 1.4vw;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 0.6vw 1.6vw rgba(0, 0, 0, 0.4);
    }
    .btn-x:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0.9vw 2.2vw rgba(255, 255, 255, 0.2);
    }
    .btn-x svg {
      width: 58%;
      height: 58%;
    }

    /* YouTube Button */
    .btn-yt {
      width: clamp(82px, 7.2vw, 190px);
      height: clamp(58px, 5.1vw, 135px);
      border-radius: 1.3vw;
      background: #ff0000;
      box-shadow: 0 0.6vw 1.6vw rgba(255, 0, 0, 0.45);
    }
    .btn-yt:hover {
      box-shadow: 0 0.9vw 2.2vw rgba(255, 0, 0, 0.75);
    }
    .btn-yt svg {
      width: 45%;
      height: 45%;
    }

    /* ==========================================================
       MOBILE & PORTRAIT RESPONSIVE FALLBACK
       ========================================================== */
    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      html, body {
        overflow-y: auto;
        height: auto;
        min-height: 100%;
      }

      .stage {
        height: auto;
        min-height: 100vh;
        padding: 28px 18px;
      }

      .layout-container {
        flex-direction: column;
        width: 100%;
        max-width: 440px;
        gap: 28px;
        padding: 36px 24px;
        border-radius: 36px;
      }

      .pfp-frame {
        width: 220px;
        height: 220px;
        border-radius: 42px;
        border-width: 7px;
      }

      .right-column {
        gap: 26px;
        width: 100%;
      }

      .title {
        font-size: 2.1rem;
        white-space: normal;
      }

      .ranks-box {
        padding: 14px 24px;
        border-radius: 22px;
        gap: 18px;
      }

      .ranks-list {
        gap: 6px;
      }

      .rank-item {
        font-size: 1.75rem;
        gap: 10px;
      }

      .socials-row {
        gap: 20px;
      }

      .btn-x, .btn-yt {
        border-radius: 18px;
      }
    }
  </style>
</head>

  <!-- Live ScoreSaber API Fetcher -->
  <script>
    (async function fetchScoreSaberRanks() {
      const playerId = "76561199105171243";
      const apiUrl = `https://scoresaber.com/api/player/${playerId}/basic`;

      // Try direct API first, then fallback to CORS proxies if the browser blocks cross-origin requests
      const endpoints = [
        apiUrl,
        `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`
      ];

      for (const url of endpoints) {
        try {
          const response = await fetch(url);
          if (!response.ok) continue;
          const data = await response.json();

          if (data && data.rank) {
            document.getElementById("global-rank").textContent = `#${data.rank.toLocaleString()}`;
          }
          if (data && data.countryRank) {
            document.getElementById("country-rank").textContent = `#${data.countryRank.toLocaleString()}`;
          }
          if (data && data.pp) {
            document.getElementById("scoresaber-card").title = 
              `ScoreSaber: ${Number(data.pp).toLocaleString()}pp (Global #${data.rank} | ${data.country} #${data.countryRank})`;
          }
          break; // Stop once we get a successful response
        } catch (err) {
          // Silently try the next endpoint in the list
        }
      }
    })();
  </script>
