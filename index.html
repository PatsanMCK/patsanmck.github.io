<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yo, i'm patsanmck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Local PFP Image */
      --pfp-image: url("photo_2024-10-15_11-06-17.jpg");
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
      background-color: #141218;
      overflow: hidden; /* Full-screen 16:9 lock on 1920x1080 and 2560x1440 */
    }

    /* Full-screen darkened & blurred PFP background */
    .bg-backdrop {
      position: fixed;
      inset: -5%;
      background-image: var(--pfp-image);
      background-size: cover;
      background-position: center;
      filter: blur(8px) brightness(0.32) contrast(1.05);
      z-index: -2;
      transform: scale(1.05);
    }

    .bg-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(87, 42, 87, 0.15) 0%, rgba(0, 0, 0, 0.55) 100%);
      z-index: -1;
    }

    /* ==========================================================
       16:9 DESKTOP STAGE (Scales seamlessly from 1920x1080 to 2560x1440)
       ========================================================== */
    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vw;
    }

    .layout-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(86vw, 152vh);
      gap: 5vw;
      padding: 3.4vw 4.2vw;
      background: rgba(20, 18, 24, 0.45);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(168, 85, 247, 0.22);
      border-radius: 2.8vw;
      box-shadow: 
        0 2vw 4.5vw rgba(0, 0, 0, 0.65),
        0 0 2.5vw rgba(139, 61, 255, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Left Side: PFP Image Box */
    .pfp-frame {
      flex-shrink: 0;
      width: clamp(260px, 28vw, 760px);
      height: clamp(260px, 28vw, 760px);
      border-radius: 3.6vw;
      border: 0.55vw solid #572a57;
      box-shadow: 
        0 1.2vw 3vw rgba(0, 0, 0, 0.65),
        0 0 2vw rgba(168, 85, 247, 0.28);
      overflow: hidden;
      background-color: #1f1b24;
      background-image: var(--pfp-image);
      background-size: cover;
      background-position: center;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .pfp-frame:hover {
      transform: scale(1.025) rotate(-1deg);
      border-color: #7d3c7d;
      box-shadow: 
        0 1.5vw 3.5vw rgba(0, 0, 0, 0.8),
        0 0 2.8vw rgba(192, 108, 255, 0.45);
    }

    .pfp-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Right Side: Text, Ranks & Socials */
    .right-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 3vw;
    }

    .title {
      font-size: clamp(2.2rem, 3.8vw, 6.2rem);
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #ffffff;
      text-shadow: 0 0.3vw 1.2vw rgba(0, 0, 0, 0.55);
      white-space: nowrap;
    }

    /* ScoreSaber Logo + Ranks Row */
    .ranks-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.6vw;
      padding: 1.1vw 2.2vw;
      border-radius: 1.8vw;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      text-decoration: none;
      color: #ffffff;
      transition: all 0.25s ease;
    }

    .ranks-box:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 222, 24, 0.45);
      transform: translateY(-0.25vw);
      box-shadow: 0 0.8vw 2vw rgba(0, 0, 0, 0.4), 0 0 1.5vw rgba(255, 222, 24, 0.15);
    }

    .scoresaber-logo {
      width: clamp(54px, 4.8vw, 130px);
      height: clamp(54px, 4.8vw, 130px);
      object-fit: contain;
      filter: drop-shadow(0 0.4vw 0.8vw rgba(0, 0, 0, 0.5));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .ranks-box:hover .scoresaber-logo {
      transform: scale(1.1) rotate(-6deg);
    }

    .ranks-list {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4vw;
    }

    .rank-item {
      display: flex;
      align-items: center;
      gap: 0.8vw;
      font-size: clamp(1.7rem, 2.7vw, 4.5rem);
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .badge-icon {
      width: clamp(28px, 2.6vw, 68px);
      height: clamp(28px, 2.6vw, 68px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0.2vw 0.5vw rgba(0, 0, 0, 0.4));
    }

    /* Social Icons Row */
    .socials-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.8vw;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease, box-shadow 0.25s ease;
    }

    .social-btn:hover {
      transform: translateY(-0.45vw) scale(1.08);
    }

    /* Telegram Button */
    .btn-tg {
      width: clamp(64px, 5.6vw, 150px);
      height: clamp(64px, 5.6vw, 150px);
      border-radius: 50%;
      background: linear-gradient(180deg, #37aee2 0%, #1e96c8 100%);
      box-shadow: 0 0.6vw 1.6vw rgba(30, 150, 200, 0.45);
    }
    .btn-tg:hover {
      box-shadow: 0 0.9vw 2.2vw rgba(55, 174, 226, 0.7);
    }
    .btn-tg svg {
      width: 52%;
      height: 52%;
      transform: translate(-3%, 2%);
    }

    /* X (Twitter) Button */
    .btn-x {
      width: clamp(64px, 5.6vw, 150px);
      height: clamp(64px, 5.6vw, 150px);
      border-radius: 1.4vw;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 0.6vw 1.6vw rgba(0, 0, 0, 0.4);
    }
    .btn-x:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0.9vw 2.2vw rgba(255, 255, 255, 0.2);
    }
    .btn-x svg {
      width: 58%;
      height: 58%;
    }

    /* YouTube Button */
    .btn-yt {
      width: clamp(82px, 7.2vw, 190px);
      height: clamp(58px, 5.1vw, 135px);
      border-radius: 1.3vw;
      background: #ff0000;
      box-shadow: 0 0.6vw 1.6vw rgba(255, 0, 0, 0.45);
    }
    .btn-yt:hover {
      box-shadow: 0 0.9vw 2.2vw rgba(255, 0, 0, 0.75);
    }
    .btn-yt svg {
      width: 45%;
      height: 45%;
    }

    /* ==========================================================
       MOBILE & PORTRAIT RESPONSIVE FALLBACK
       ========================================================== */
    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      html, body {
        overflow-y: auto;
        height: auto;
        min-height: 100%;
      }

      .stage {
        height: auto;
        min-height: 100vh;
        padding: 28px 18px;
      }

      .layout-container {
        flex-direction: column;
        width: 100%;
        max-width: 440px;
        gap: 28px;
        padding: 36px 24px;
        border-radius: 36px;
      }

      .pfp-frame {
        width: 220px;
        height: 220px;
        border-radius: 42px;
        border-width: 7px;
      }

      .right-column {
        gap: 26px;
        width: 100%;
      }

      .title {
        font-size: 2.1rem;
        white-space: normal;
      }

      .ranks-box {
        padding: 14px 24px;
        border-radius: 22px;
        gap: 18px;
      }

      .ranks-list {
        gap: 6px;
      }

      .rank-item {
        font-size: 1.75rem;
        gap: 10px;
      }

      .socials-row {
        gap: 20px;
      }

      .btn-x, .btn-yt {
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>

  <!-- Background Layers -->
  <div class="bg-backdrop"></div>
  <div class="bg-vignette"></div>

  <!-- Main 16:9 Stage -->
  <main class="stage">
    <div class="layout-container">
      
      <!-- Left Column: PFP -->
      <div class="pfp-frame">
        <img 
          src="photo_2024-10-15_11-06-17.jpg" 
          alt="patsanmck avatar" 
          class="pfp-img"
          onerror="this.style.display='none'"
        />
      </div>

      <!-- Right Content Column -->
      <div class="right-column">
        <h1 class="title">yo, i’m patsanmck</h1>

        <!-- ScoreSaber Profile Link + Live API Ranks -->
        <a 
          id="scoresaber-card"
          href="https://scoresaber.com/u/76561199105171243" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="ranks-box" 
          title="View ScoreSaber Profile"
        >
          <img 
            src="https://scoresaber.com/scoresaber.svg" 
            alt="ScoreSaber" 
            class="scoresaber-logo" 
          />

          <div class="ranks-list">
            <div class="rank-item">
              <span id="global-rank">#464</span>
              <span class="badge-icon" title="Global Rank">🌎</span>
            </div>
            <div class="rank-item">
              <span id="country-rank">#11</span>
              <span class="badge-icon" title="Country Rank">
                <svg viewBox="0 0 36 27" width="100%" height="78%" style="border-radius: 4px; overflow: hidden;">
                  <rect width="36" height="9" y="0" fill="#ffffff"/>
                  <rect width="36" height="9" y="9" fill="#0039a6"/>
                  <rect width="36" height="9" y="18" fill="#d52b1e"/>
                </svg>
              </span>
            </div>
          </div>
        </a>

        <!-- Social Buttons (No "clickable ^" text needed!) -->
        <div class="socials-row">
          
          <!-- Telegram -->
          <a href="https://t.me/PatsanMCK" target="_blank" rel="noopener noreferrer" class="social-btn btn-tg" aria-label="Telegram" title="Telegram">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20.665 3.717L2.935 10.554C1.725 11.04 1.732 11.715 2.713 12.016L7.265 13.436L17.797 6.791C18.295 6.488 18.75 6.651 18.376 6.983L9.843 14.684H9.841L9.843 14.685L9.529 19.377C9.989 19.377 10.192 19.166 10.45 18.917L12.661 16.767L17.26 20.164C18.108 20.631 18.717 20.391 18.928 19.379L21.947 5.151C22.256 3.912 21.474 3.351 20.665 3.717Z" fill="#ffffff"/>
            </svg>
          </a>

          <!-- X (Twitter) -->
          <a href="https://x.com/PatsanMCK" target="_blank" rel="noopener noreferrer" class="social-btn btn-x" aria-label="X" title="X (Twitter)">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18.244 2.25H21.552L14.325 10.51L22.827 21.75H16.17L10.956 14.933L4.99 21.75H1.68L9.41 12.915L1.254 2.25H8.08L12.793 8.481L18.244 2.25ZM17.083 19.77H18.916L7.084 4.126H5.117L17.083 19.77Z" fill="#ffffff"/>
            </svg>
          </a>

          <!-- YouTube -->
          <a href="https://youtube.com/@PatsanMCK" target="_blank" rel="noopener noreferrer" class="social-btn btn-yt" aria-label="YouTube" title="YouTube">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 5.14V19.14L19 12.14L8 5.14Z" fill="#ffffff"/>
            </svg>
          </a>

        </div>

      </div>
    </div>
  </main>
  <!-- ScoreSaber Rank Loader (Powered by GitHub Actions) -->
  <script>
    (async function loadScoreSaberRanks() {
      // Only fetch scoresaber.json when hosted on http/https (GitHub Pages)
      if (!location.protocol.startsWith("http")) return;

      try {
        const response = await fetch(`./scoresaber.json?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) return;
        const data = await response.json();

        if (data && typeof data.rank === "number") {
          document.getElementById("global-rank").textContent = `#${data.rank.toLocaleString()}`;
        }
        if (data && typeof data.countryRank === "number") {
          document.getElementById("country-rank").textContent = `#${data.countryRank.toLocaleString()}`;
        }
        if (data && data.pp) {
          document.getElementById("scoresaber-card").title = 
            `ScoreSaber: ${Number(data.pp).toLocaleString()}pp (Global #${data.rank} | ${data.country} #${data.countryRank})`;
        }
      } catch (e) {
        // Silently use the ranks already baked into index.html by GitHub Actions
      }
    })();
  </script>
</body>
</html>
