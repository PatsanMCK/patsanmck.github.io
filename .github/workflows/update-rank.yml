name: Update ScoreSaber Rank

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:       # Adds a button to run it manually anytime
  push:
    branches: [ main ]     # Also runs immediately when you save this file!

permissions:
  contents: write

jobs:
  update-rank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch ScoreSaber API & Update HTML
        run: |
          curl -s -f -A "Mozilla/5.0" "https://scoresaber.com/api/player/76561199105171243/basic" -o scoresaber.json
          
          # Extract live rank and countryRank using jq (pre-installed on GitHub Ubuntu runners)
          RANK=$(jq -r '.rank' scoresaber.json)
          CRANK=$(jq -r '.countryRank' scoresaber.json)
          
          echo "Fetched Global Rank: #$RANK | Country Rank: #$CRANK"
          
          # Update index.html directly as well so the HTML itself always has the latest numbers!
          if [ "$RANK" != "null" ] && [ -n "$RANK" ]; then
            sed -i -E "s/(<span id=\"global-rank\">#)[^<]+(<\/span>)/\1${RANK}\2/" index.html
          fi
          if [ "$CRANK" != "null" ] && [ -n "$CRANK" ]; then
            sed -i -E "s/(<span id=\"country-rank\">#)[^<]+(<\/span>)/\1${CRANK}\2/" index.html
          fi

      - name: Commit and Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scoresaber.json index.html
          git diff --staged --quiet || (git commit -m "Auto-update ScoreSaber rank" && git push)
